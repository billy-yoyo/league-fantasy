{% load static %}

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{% static 'style-v3.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="shortcut icon" type="image/svg" href="{% static 'favicon.svg' %}">
  <title>Tournament Setup - Step 1</title>
  <style>
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: 'Roboto', sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px;
      background: #2a2a2a;
      border-radius: 8px;
    }
    h1 {
      margin-bottom: 10px;
    }
    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }
    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
    }
    input[type="text"]:focus, input[type="url"]:focus {
      outline: none;
      border-color: #4a9eff;
    }
    .btn {
      padding: 12px 24px;
      background: #4a9eff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #3a8eef;
    }
    .error {
      background: #d32f2f;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .example {
      color: #888;
      font-size: 14px;
      margin-top: 5px;
    }
    .back-link {
      display: inline-block;
      color: #4a9eff;
      text-decoration: none;
      margin-bottom: 20px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/admin-tools/" class="back-link">&larr; Back to Admin</a>

    <h1>Create New Tournament</h1>
    <p class="subtitle">Step 1 of 3: Enter Tournament Information</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="fandom_url">Leaguepedia (Fandom) URL</label>
        <input
          type="url"
          id="fandom_url"
          name="fandom_url"
          required
          placeholder="https://lol.fandom.com/wiki/LEC/2026_Season/Spring_Season"
        />
        <div class="example">
          Example: https://lol.fandom.com/wiki/LEC/2026_Season/Spring_Season
        </div>
      </div>

      <button type="submit" class="btn">Continue to Team Setup</button>
    </form>
  </div>
</body>
</html>
